<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExploMonde — Recherche de pays</title>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <a class="skip-link" href="#contenu-principal">
        Aller directement au contenu principal
    </a>

    <header class="site-header">
        <h1 class="site-title">ExploMonde</h1>

        <nav class="main-navigation" aria-label="Navigation principale">
            <a href="#recherche">Rechercher</a>
            <a href="#resultats">Résultats</a>
        </nav>
    </header>

    <main id="contenu-principal" class="page-content" tabindex="-1">
        <section id="recherche" class="search-section">
            <h2>Rechercher un pays</h2>

            <form id="formulaire-recherche" class="search-form">
                <div class="form-field">
                    <label for="recherche-pays">Nom du pays</label>

                    <input
                        type="search"
                        id="recherche-pays"
                        name="recherche-pays"
                        placeholder="Exemple : France"
                    >
                </div>

                <div class="form-field">
                    <label for="filtre-region">Région</label>

                    <select id="filtre-region" name="filtre-region">
                        <option value="">Toutes les régions</option>
                        <option value="Afrique">Afrique</option>
                        <option value="Amérique">Amérique</option>
                        <option value="Asie">Asie</option>
                        <option value="Europe">Europe</option>
                        <option value="Océanie">Océanie</option>
                    </select>
                </div>

                <button class="primary-button" type="submit">
                    Rechercher
                </button>
            </form>
        </section>

        <section id="resultats" class="results-section">
            <h2>Résultats</h2>

            <p id="statut-resultats" class="results-status" role="status">
                Chargement des pays…
            </p>

            <div id="liste-pays" class="country-grid"></div>
        </section>

        <section
            id="detail-pays"
            class="country-detail"
            aria-live="polite"
            tabindex="-1"
            hidden
        ></section>
    </main>

    <footer class="site-footer">
        <p>ExploMonde</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
